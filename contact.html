<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rent A Car - Contact</title>
</head>
<body class="page">

    <div class="topbar">
        <a href="index.html"><img src="logo.svg" alt="Rent A Car" class="logo-img"></a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </div>

    <div class="page-content">

        <div class="banner">
            <div class="banner-text">
                <h1>Contact</h1>
                <p>Na kontaktoni për çdo pyetje ose rezervim</p>
            </div>
        </div>

        <div class="contact-wrap">

            <div class="contact-info">
                <div class="info-card">
                    <h3>Telefon</h3>
                    <p>+383 44 000 000</p>
                </div>
                <div class="info-card">
                    <h3>Email</h3>
                    <p>info@rentacar.com</p>
                </div>
                <div class="info-card">
                    <h3>Adresa</h3>
                    <p>Prishtinë, Kosovë</p>
                </div>
                <div class="info-card">
                    <h3>Orari</h3>
                    <p>E hënë - E diel: 08:00 - 20:00</p>
                </div>
            </div>

            <form class="contact-form">
                <h2>Na dërgoni mesazh</h2>
                <input type="text" placeholder="Emri">
                <input type="email" placeholder="Email">
                <textarea placeholder="Mesazhi" rows="5"></textarea>
                <button type="button" class="form-btn">Dërgo</button>
            </form>

        </div>
    </div>

    <div class="bottombar">
        <p>© 2026 Rent A Car. Të gjitha të drejtat e rezervuara.</p>
    </div>

</body>
</html>
